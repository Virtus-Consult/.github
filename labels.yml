# Labels padrão da organização Virtus.
# Sincronizadas para todos os repos pelo workflow .github/workflows/sync-labels.yml

# Tipo
- name: "tipo: bug"
  color: "d73a4a"
  description: "Algo não está funcionando"
- name: "tipo: funcionalidade"
  color: "a2eeef"
  description: "Nova funcionalidade ou melhoria"
- name: "tipo: tarefa"
  color: "c5def5"
  description: "Trabalho técnico interno"
- name: "tipo: docs"
  color: "0075ca"
  description: "Documentação"
- name: "tipo: segurança"
  color: "b60205"
  description: "Relacionado a segurança"
- name: "dependencies"
  color: "0366d6"
  description: "Atualização de dependências (Dependabot)"

# Prioridade
- name: "prioridade: crítica"
  color: "b60205"
  description: "Resolver imediatamente"
- name: "prioridade: alta"
  color: "d93f0b"
  description: "Resolver no ciclo atual"
- name: "prioridade: média"
  color: "fbca04"
  description: "Resolver em breve"
- name: "prioridade: baixa"
  color: "0e8a16"
  description: "Quando houver tempo"

# Status
- name: "status: triagem"
  color: "ededed"
  description: "Aguardando análise"
- name: "status: bloqueado"
  color: "000000"
  description: "Depende de algo externo"
- name: "status: precisa de info"
  color: "fef2c0"
  description: "Aguardando mais informações de quem abriu"
- name: "status: não será feito"
  color: "ffffff"
  description: "Fora do escopo"
- name: "status: duplicado"
  color: "cfd3d7"
  description: "Já existe issue semelhante"

# Comunidade
- name: "good first issue"
  color: "7057ff"
  description: "Boa para quem está começando"
- name: "help wanted"
  color: "008672"
  description: "Ajuda bem-vinda"
